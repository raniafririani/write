an atas bajunya dengan pisau. tvOnenews dan REQNews menyebut alat yang dipakai adalah cutter. Kedua media itu juga melaporkan bagian bahu RU sempat terlihat, dan tvOnenews menambahkan bahwa ia sempat didorong saat diarak. Menurut Radar Bogor, keadaan mereda setelah pengelola pasar melerai kerumunan.", "Menurut Kapolsek, barang yang diduga diambil RU meliputi delapan kemasan minyak goreng, mi instan, tempe, bawang putih, cabai, bakso, sabun deterjen, sabun batang, dan sandal milik seorang pedagang. Daftar barang di media lain lebih ringkas dan tidak seragam.", "Suyoko mengatakan peristiwa itu tidak dilaporkan ke kepolisian dan barang-barang tersebut sudah dikembalikan kepada pemiliknya. Ia menyayangkan warga tidak menghubungi polisi saat kejadian. Perbuatan itu, katanya, melanggar hukum, tetapi sisi kemanusiaan tetap harus dipertimbangkan. Liputan6 melaporkan polisi juga menyayangkan tindakan persekusi terhadap RU.", "Soal alasannya, tvOnenews melaporkan, dengan merujuk Polsek Cibungbulang, bahwa RU mengaku mengambil barang karena kesulitan ekonomi, sementara suaminya sakit sekitar empat tahun. Bogor Today menambahkan bahwa keluarga itu menanggung utang puluhan juta rupiah. Radar Bogor melaporkan penelusuran awal polisi menemukan keluarga RU menghadapi kesulitan ekonomi dan masalah kesehatan.", "Pada Minggu, 8 November 2026 sore, petugas Polsek Cibungbulang mendatangi rumah RU di Kelurahan Batutulis, Kecamatan Bogor Selatan, Kota Bogor. Menurut Bogor Today, kedatangan itu untuk meminta keterangan dan memastikan kondisinya setelah video tersebar. FBINews menulis polisi datang bersama Dinas Sosial, tetapi keterangan ini belum ditemukan di sumber lain.", "Hingga tulisan ini disusun, JurnalPatrolinews menyebut belum ada keterangan resmi tentang proses hukum terhadap warga yang mempermalukan RU. Kapolsek menyatakan penyelidikan dapat langsung dilakukan bila ada laporan."], "sources": ["Viral Nenek di Bogor Bajunya Disobek-sobek Warga karena Mencuri di Pasar, detikNews, 8 const codeBox=()=>`<div class="code">${CODE.map((c,i)=>`<div><span class="n">0${i+1}</span><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div>`;
function home(){const a=ARTICLES[0];if(!a)return `<div class="wrap"><div class="page-h"><h1>${LOADERR?'Tulisan belum bisa dimuat':'Belum ada tulisan'}</h1><p>${LOADERR?'Coba muat ulang halaman beberapa saat lagi.':'Tulisan pertama akan segera terbit.'}</p></div></div>`;
 return `<div class="wrap"><section class="lead"><a class="hero" href="#/tulisan/${a.id}"><div class="kick">${a.cat}<span>${a.tag} · ${a.date}</span></div><h1>${a.title}</h1><p>${a.dek}</p><span class="more">Baca selengkapnya</span></a>
 <div class="side"><h3>Tulisan terbaru</h3>${ARTICLES.map(row).join('')}<div class="empty" style="margin-top:16px">Tulisan baru akan terbit di sini. Pantau terus ya.</div></div></section>
 <section class="sec"><div class="sh"><h2>Jenis tulisan</h2></div><div class="cats">${CATS.map(c=>`<a class="cat" href="#/arsip/${c[0]}"><h3>${c[0]}</h3><p>${c[1]}</p><small>${count(c[0])?count(c[0])+' tulisan':'Segera hadir'} →</small></a>`).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Cara saya menulis</h2></div>${codeBox()}</section></div>`}
function arsip(f){const L=f?ARTICLES.filter(a=>a.cat===f):ARTICLES;
 return `<div class="wrap"><div class="page-h"><h1>${f||'Arsip'}</h1><p>${f?CATS.find(c=>c[0]===f)[1]:'Semua tulisan, dari yang terbaru.'}</p></div>
 <div class="chips" style="margin-top:22px">${[['','Semua'],...CATS.map(c=>[c[0],c[0]])].map(c=>`<a class="chip" aria-pressed="${(f||'')===c[0]}" href="#/arsip${c[0]?'/'+c[0]:''}">${c[1]}</a>`).join('')}</div>
 <div>${L.length?L.map(row).join(''):'<div class="empty" style="margin-top:20px">Belum ada tulisan di kategori ini. Segera hadir.</div>'}</div></div>`}
function artikel(id){const a=ARTICLES.find(x=>x.id===id);if(!a)return notfound();document.title=a.t+' — writebyrani';
 return `<article class="art"><div class="kick">${a.cat}<span>${a.tag?a.tag:''}</span></div><h1>${a.title}</h1><p class="dek">${a.dek}</p>
 <div class="by"><span>Oleh <b>Maulida Afririani</b></span><span>Bogor</span><span>${a.date}</span></div>
 ${a.body.length?a.body.map(p=>`<p>${p}</p>`).join(''):'<p>Naskah lengkap tulisan ini sedang dirapikan dan akan segera tayang di sini.</p>'}
 <div class="note"><b>Catatan verifikasi</b>${a.note}</div>
 ${a.sources.length?`<div class="src"><h3>Sumber</h3><ol>${a.sources.map(s=>`<li>${s}</li>`).join('')}</ol></div>`:''}
 <a class="back" href="#/arsip">← Kembali ke arsip</a></article>`}
function tentang(){return `<div class="wrap"><div class="page-h"><h1>Tentang penulis</h1></div><div class="about"><div>
 <p><b>Maulida Afririani</b> menulis berita, feature, opini, dan karya sastra dari Bogor. Situs ini adalah tempat saya mengumpulkan tulisan dan menunjukkan cara kerjanya: setiap data ada sumbernya, dan perbedaan antar sumber dicatat.</p>
 <p>Di luar menulis, saya membangun website dan dashboard lewat studio web runbyrani, dan bekerja di bidang data dan operasional. Cerita lengkapnya ada di portofolio developer saya.</p>
 <p><a class="back" style="margin:0" href="https://portofolio-eight-woad-93.vercel.app/">Lihat portofolio developer →</a></p></div>
 <div class="box"><h3>Hubungi saya</h3><a href="mailto:raaniafririanii@gmail.com">raaniafririanii@gmail.com</a><a href="https://www.linkedin.com/in/maulidaafririani" target="_blank" rel="noopener">LinkedIn</a><a href="https://instagram.com/ahnranii" target="_blank" rel="noopener">Instagram @ahnranii</a></div></div>
 <section class="sec"><div class="sh"><h2>Cara saya menulis</h2></div>${codeBox()}</section></div>`}
function notfound(){return `<div class="wrap"><div class="page-h"><h1>Halaman tidak ditemukan</h1><p><a class="back" href="#/">← Ke beranda</a></p></div></div>`}
function route(){const p=(location.hash.slice(1)||'/').split('/').filter(Boolean);document.title='writebyrani — Berita, feature, opini, dan sastra dari Bogor';
 let h;if(!p.length)h=home();else if(p[0]==='arsip')h=arsip(decodeURIComponent(p[1]||''));else if(p[0]==='tulisan')h=artikel(p[1]);else if(p[0]==='tentang')h=tentang();else h=notfound();
 main.style.animation='none';void main.offsetWidth;main.style.animation='';main.innerHTML=h;scrollTo(0,0);
 const k='#/'+(p[0]||'')+(p[0]==='arsip'&&p[1]?'/'+p[1]:'');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===k||(p[0]==='tulisan'&&a.getAttribute('href')==='#/arsip/'+(ARTICLES.find(x=>x.id===p[1])||{}).cat)))}
$('#nav').innerHTML=NAV.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join('')+'<a class="out" href="https://portofolio-eight-woad-93.vercel.app/">Portofolio developer ↗</a>';
function setTicker(){const t=ARTICLES.map(a=>a.title).concat(['Tulisan baru segera hadir']);$('#run').innerHTML=[...t,...t,...t,...t].map(x=>`<span>${x}</span>`).join('')}
$('#tgl').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
addEventListener('hashchange',route);main.innerHTML='<div class="wrap"><div class="page-h"><p>Memuat tulisan…</p></div></div>';
load().then(r=>{ARTICLES=r}).catch(()=>{LOADERR=true}).finally(()=>{setTicker();route()});
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#bar').style.transform='scaleX('+(h>0?scrollY/h:0)+')'},{passive:true});
</script>
</body>
</html>
